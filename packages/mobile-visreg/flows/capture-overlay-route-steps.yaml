appId: ${APP_ID}
---
# Sub-flow for overlay routes (alerts, modals, trays, drawers, etc.).
# Scrolls to the route, taps it, opens the overlay, captures a screenshot,
# closes it, then taps nav-back-button to return to the debug list.
# Required env vars: ROUTE_NAME, PLATFORM_SUFFIX (inherited from capture-all.yaml)

- scrollUntilVisible:
    element:
      text: ${ROUTE_NAME}
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ${ROUTE_NAME}
- assertVisible:
    id: mobile-playground-screen
- waitForAnimationToEnd
- tapOn: 'Open'
- waitForAnimationToEnd
- takeScreenshot: ${ROUTE_NAME}${PLATFORM_SUFFIX}
- tapOn:
    text: 'Cancel'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: nav-back-button
- waitForAnimationToEnd
