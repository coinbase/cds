appId: ${APP_ID}
---
# Sub-flow: scroll the debug screen list to the target route, tap it, capture a
# screenshot, then tap the nav-back-button to return to the list.
# Required env vars: ROUTE_NAME, PLATFORM_SUFFIX (inherited from capture-all.yaml)

- scrollUntilVisible:
    element:
      text: ${ROUTE_NAME}
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ${ROUTE_NAME}
- assertVisible:
    id: mobile-playground-screen
- waitForAnimationToEnd
- takeScreenshot: ${ROUTE_NAME}${PLATFORM_SUFFIX}
- tapOn:
    id: nav-back-button
- waitForAnimationToEnd
