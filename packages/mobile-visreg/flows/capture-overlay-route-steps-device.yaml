appId: ${APP_ID}
---
# Sub-flow for overlay routes (alerts, modals, trays, drawers, etc.) on
# BrowserStack real devices. Mirrors capture-overlay-route-steps.yaml but uses
# scrollUntilVisible + tapOn instead of openLink (see capture-route-steps-device.yaml
# for the explanation). After closing the overlay, swipes back to the debug list.
# Required env vars: ROUTE_NAME, PLATFORM_SUFFIX (inherited from capture-all.yaml)

- scrollUntilVisible:
    element:
      text: ${ROUTE_NAME}
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ${ROUTE_NAME}
- assertVisible:
    id: mobile-playground-screen
- waitForAnimationToEnd
# Open overlay, capture, then close before navigating back
- tapOn: 'Open'
- waitForAnimationToEnd
- takeScreenshot: ${ROUTE_NAME}${PLATFORM_SUFFIX}
- tapOn:
    text: 'Cancel'
    optional: true
- waitForAnimationToEnd
- swipe:
    start: '0%,50%'
    end: '40%,50%'
- waitForAnimationToEnd
