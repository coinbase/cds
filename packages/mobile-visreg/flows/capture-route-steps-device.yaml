appId: ${APP_ID}
---
# Sub-flow for BrowserStack real-device runs (replaces capture-route-steps.yaml).
# Uses scrollUntilVisible + tapOn instead of openLink because Maestro's openLink
# on iOS real devices fails with "Invalid device" — the lower-level device channel
# it uses is not available on BrowserStack's infrastructure.
# After the screenshot, taps the "Back" header button to return to the debug list.
# Required env vars: ROUTE_NAME, PLATFORM_SUFFIX (inherited from capture-all.yaml)

- scrollUntilVisible:
    element:
      text: ${ROUTE_NAME}
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ${ROUTE_NAME}
- assertVisible:
    id: mobile-playground-screen
- waitForAnimationToEnd
- takeScreenshot: ${ROUTE_NAME}${PLATFORM_SUFFIX}
- tapOn: Back
- waitForAnimationToEnd
