name: CDSGallery
options:
  bundleIdPrefix: com.coinbase.cds
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true

# Consume the vendored theme library from packages/cds-ios (the iOS analog of apps/android-app
# depending on packages/cds-android). The generated CDSGallery.xcodeproj is git-ignored;
# project.yml is the source of truth.
packages:
  CDSDesignSystem:
    path: ../../packages/cds-ios

targets:
  CDSGalleryiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: CDSDesignSystem
        product: CDSDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coinbase.cds.gallery
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '1.0'
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
