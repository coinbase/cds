name: Android

# Native Android pipeline: JDK 21 + Android SDK + Gradle. Do not fold these jobs
# into ci.yml — those runners have no JDK or Android SDK, and `nx affected
# --target=test` would otherwise invoke Gradle for any project tagged
# `platform:android`.
#
# Path filters are the inverse of ci.yml's paths-ignore, so an Android-only
# change runs here and not there, a JS-only change runs there and not here, and
# a mixed PR runs both. Keep the two lists in sync when adding Android paths.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'apps/android-app/**'
      - 'packages/cds-android/**'
      - '.github/workflows/android.yml'
      - '.github/actions/setup-android/**'
  pull_request:
    branches:
      - master
    paths:
      - 'android/**'
      - 'apps/android-app/**'
      - 'packages/cds-android/**'
      - '.github/workflows/android.yml'
      - '.github/actions/setup-android/**'

concurrency:
  group: Android-${{github.ref_name}}-${{github.event_name == 'pull_request' && github.event.pull_request.number || github.sha}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

env:
  CI: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup-android
      # Same Gradle task as `yarn nx run cds-android:test` (packages/cds-android/project.json).
      # Invoked directly so this workflow does not need Yarn, Node, or the JS install.
      - name: Test
        run: ./android/gradlew -p android :cds:test
