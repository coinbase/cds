name: Android

# Reusable native Android pipeline. ci.yml decides whether the Gradle toolchain is affected.

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: Android-${{github.ref_name}}-${{github.event_name == 'pull_request' && github.event.pull_request.number || github.sha}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

permissions:
  contents: read

env:
  CI: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup-android
      - name: Test CDS library
        run: ./android/gradlew -p android :cds:test
      - name: Build CDS library
        run: ./android/gradlew -p android :cds:assembleRelease
      - name: Test demo app
        run: ./android/gradlew -p android :app:testDebugUnitTest
      - name: Build demo app
        run: ./android/gradlew -p android :app:assembleDebug
