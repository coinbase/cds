---
name: Backport

on:
  pull_request_target:
    types:
      - closed
    branches:
      - master

permissions:
  contents: read

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Create backport pull requests
        uses: korthout/backport-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Labels must match "backport release-N.x" (e.g. "backport release-8.x")
          label_pattern: '^backport (release-\d+\.x)$'
          # Exclude version files so the release branch retains its own versioning.
          # The backport author must run `yarn bump-version` on the backport branch
          # to create a release-branch-appropriate patch version before merging.
          cherry-pick-ignore-patterns: |
            **/package.json
            **/CHANGELOG.md
