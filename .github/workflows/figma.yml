name: Figma Operations

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  # Validate web Figma Code Connect mappings on PRs
  validate-code-connect-web:
    name: Validate Code Connect (Web)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - name: Check Figma Token
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "Error: FIGMA_ACCESS_TOKEN environment variable is not set or is empty."
            echo ""
            echo "To fix this:"
            echo "  1. Ensure FIGMA_ACCESS_TOKEN is set in your GitHub repository secrets"
            echo "  2. Verify the secret is being passed to the workflow step via the env block"
            echo ""
            exit 1
          fi
          echo "✓ FIGMA_ACCESS_TOKEN is set"
      - name: Validate Code Connect (dry-run)
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn code-connect:publish:web --dry-run

  # Validate mobile Figma Code Connect mappings on PRs
  validate-code-connect-mobile:
    name: Validate Code Connect (Mobile)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - name: Check Figma Token
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "Error: FIGMA_ACCESS_TOKEN environment variable is not set or is empty."
            echo ""
            echo "To fix this:"
            echo "  1. Ensure FIGMA_ACCESS_TOKEN is set in your GitHub repository secrets"
            echo "  2. Verify the secret is being passed to the workflow step via the env block"
            echo ""
            exit 1
          fi
          echo "✓ FIGMA_ACCESS_TOKEN is set"
      - name: Validate Code Connect (dry-run)
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn code-connect:publish:mobile --dry-run

  # Publish Figma Code Connect mappings for affected packages
  publish-code-connect:
    name: Publish Code Connect
    runs-on: ubuntu-latest
    if: github.ref_name == 'master' && github.event_name == 'push'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup
      - name: Check Figma Token
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "Error: FIGMA_ACCESS_TOKEN environment variable is not set or is empty."
            echo ""
            echo "To fix this:"
            echo "  1. Ensure FIGMA_ACCESS_TOKEN is set in your GitHub repository secrets"
            echo "  2. Verify the secret is being passed to the workflow step via the env block"
            echo ""
            exit 1
          fi
          echo "✓ FIGMA_ACCESS_TOKEN is set"
      - name: Publish Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn code-connect:publish

  audit-figma-integrations:
    name: Audit Figma Integrations
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref_name == 'master' && github.event_name == 'push')
    # Publishes into the gh-pages branch (at /figma-audit/) alongside the PR
    # previews, so it never takes over the whole Pages site the way
    # actions/deploy-pages would.
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup
      - name: Run Audit
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn audit-figma-integration --html
      - name: Stage report
        run: |
          set -euo pipefail
          # The audit writes temp/figma-audit-<date>.html; publish the newest as index.html.
          mkdir -p audit-out
          latest="$(ls -t temp/figma-audit-*.html | head -n1)"
          cp "$latest" audit-out/index.html

      # Checkout gh-pages into a nested path so we can push into /figma-audit/
      # without disturbing the PR previews or the selector at the root.
      - name: Checkout gh-pages
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: gh-pages
          path: gh-pages-checkout
          fetch-depth: 1

      - name: Publish audit to gh-pages/figma-audit
        working-directory: gh-pages-checkout
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Replace only the figma-audit/ subtree; everything else on gh-pages
          # (selector, pr-N/* previews, manifest) is preserved by the reset.
          apply_changes() {
            rm -rf figma-audit
            mkdir -p figma-audit
            cp -r ../audit-out/* figma-audit/
            # Serve assets verbatim (no Jekyll processing) for the whole site.
            touch .nojekyll
          }

          git fetch origin gh-pages
          git reset --hard origin/gh-pages

          apply_changes
          git add -A
          if git diff --staged --quiet; then
            echo "No audit changes to publish"
            exit 0
          fi

          # Non-lossy concurrency handling shared with the preview-deploy workflow:
          # each writer re-applies only its own subtree on top of the latest
          # gh-pages and retries with --force-with-lease. Orphan commits keep the
          # branch at a single root commit so binaries never accumulate in history.
          MAX_ATTEMPTS=8
          MAX_BACKOFF_SECONDS=30
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            SQUASHED=$(git commit-tree HEAD^{tree} -m "Publish Figma integration audit")
            if git push --force-with-lease origin "${SQUASHED}:refs/heads/gh-pages"; then
              echo "✅ Published audit to /figma-audit/ (attempt ${attempt}/${MAX_ATTEMPTS})"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            BACKOFF=$(( (1 << (attempt - 1)) + RANDOM % 5 ))
            if [ "$BACKOFF" -gt "$MAX_BACKOFF_SECONDS" ]; then
              BACKOFF=$MAX_BACKOFF_SECONDS
            fi
            echo "Push failed (concurrent update?), re-applying and retrying in ${BACKOFF}s (${attempt}/${MAX_ATTEMPTS})..."
            sleep "$BACKOFF"
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            apply_changes
            git add -A
            attempt=$((attempt + 1))
          done

          echo "❌ Failed to push audit after ${MAX_ATTEMPTS} attempts"
          exit 1
