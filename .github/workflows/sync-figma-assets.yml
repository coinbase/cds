name: Sync Figma Assets

# Syncs icons and illustrations from Figma and pushes a branch for each, so designers no longer need
# an engineer to run the sync by hand. An engineer still opens and reviews every PR, does the manual
# visreg check and merges it; nothing is merged automatically.
#
# A sync without renamed or deleted assets is also released: the workflow applies the version plan
# (`yarn release`) on the same branch, so merging the PR publishes the package. A breaking sync keeps
# only the version plan, because it needs a migration guide and a migrator before it can be released.
#
# By default the workflow only pushes the sync branch; it does not create the pull request. The
# Slack message that ends the run links to the pull request form for that branch, with the title and
# description filled in, and a person opens it, which also makes CI run as usual. Set
# vars.FIGMA_SYNC_OPEN_PR to 'true' to have the workflow open the pull request itself, where Actions
# may create them.
#
# Every run ends with one Slack message per target: the sync failed and why, it ran and Figma had
# nothing new, or it pushed a branch with the new, updated, deleted and renamed counts and the link to
# open the pull request. All of them list the assets design still has to fix in Figma; those are
# skipped, never published.
#
# Repository configuration (all optional except the Figma token):
#   secrets.FIGMA_ACCESS_TOKEN                Figma token used by the syncs.
#   vars.FIGMA_SYNC_OPEN_PR                   'true' to create the pull request from the workflow
#                                             instead of linking to the form. Defaults to linking.
#   secrets.FIGMA_SYNC_SLACK_WEBHOOK_URL      Slack webhook for the message that ends each run. Falls back to
#                                             secrets.SLACK_WEBHOOK_URL; with neither set, Slack is skipped.
#   vars.FIGMA_SYNC_SCHEDULE_ENABLED          Set to 'true' to turn on the weekday schedule.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to sync
        type: choice
        options:
          - all
          - icons
          - illustrations
        default: all
      sync-all:
        description: Sync every asset, not only those changed since the last sync
        type: boolean
        default: false
  schedule:
    - cron: '0 14 * * 1-5'

concurrency:
  group: sync-figma-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync ${{ matrix.target }}
    if: github.event_name != 'schedule' || vars.FIGMA_SYNC_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'icons' && '["icons"]' || inputs.target == 'illustrations' && '["illustrations"]' || '["icons","illustrations"]') }}
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Set the sync report path
        run: echo "SYNC_REPORT_PATH=${RUNNER_TEMP}/sync-report.json" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Look for an open sync pull request
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          # The manifest on master only advances when a sync PR merges, so a new scheduled sync would
          # repeat the changes of one that is still waiting for review.
          open=$(gh pr list --state open --json number,url,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"${TARGET}/\"))][0].url // \"\"")
          echo "url=${open}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ -n "${open}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A ${TARGET} sync pull request is already open, so this scheduled run skipped it: ${open}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup-node-ci
        if: steps.open-pr.outputs.skip != 'true'

      - name: Configure git identity
        if: steps.open-pr.outputs.skip != 'true'
        run: |
          # setup-node-ci writes enableGlobalCache and enableHardenedMode into .yarnrc.yml, and the
          # sync refuses to start on a dirty tree.
          git checkout -- .yarnrc.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync ${{ matrix.target }} from Figma
        id: sync
        if: steps.open-pr.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          SYNC_ALL: ${{ inputs.sync-all }}
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          args=()
          if [ "${SYNC_ALL}" = "true" ]; then args+=(--sync-all); fi
          yarn nx run "${TARGET}:sync-${TARGET}" -- "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/sync.log"

      - name: Read the sync report
        id: report
        if: steps.open-pr.outputs.skip != 'true'
        run: |
          if [ ! -f "${SYNC_REPORT_PATH}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=$(jq -r '.branch' "${SYNC_REPORT_PATH}")
          rejected=$(jq '.rejected | length' "${SYNC_REPORT_PATH}")
          pushed=false
          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null 2>&1; then pushed=true; fi
          {
            echo "found=true"
            echo "branch=${branch}"
            echo "pushed=${pushed}"
            echo "rejected=${rejected}"
            echo "breaking=$(jq -r '.breaking' "${SYNC_REPORT_PATH}")"
          } >> "$GITHUB_OUTPUT"

      - name: Release the package
        id: release
        if: steps.report.outputs.pushed == 'true' && steps.report.outputs.breaking == 'false'
        env:
          BRANCH: ${{ steps.report.outputs.branch }}
          TARGET: ${{ matrix.target }}
        run: |
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          yarn release --projects="${TARGET}"
          # nx release deletes every pending version plan of the group without releasing it. Put
          # back the plans that also name another package, so that package still gets its release.
          for plan in $(git diff --name-only --diff-filter=D HEAD -- .nx/version-plans); do
            others=$(git show "HEAD:${plan}" |
              awk 'NR == 1 && $0 == "---" { inside = 1; next } inside && $0 == "---" { exit } inside { split($0, kv, ":"); print kv[1] }' |
              grep -vxF "${TARGET}" || true)
            if [ -n "${others}" ]; then git checkout HEAD -- "${plan}"; fi
          done
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to release."
            exit 0
          fi
          git commit -m "chore: release ${TARGET}"
          git push --force-with-lease origin "${BRANCH}"

      - name: Open or update the pull request
        id: pull-request
        if: steps.report.outputs.pushed == 'true' && vars.FIGMA_SYNC_OPEN_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.report.outputs.branch }}
        run: |
          body_file="${RUNNER_TEMP}/pr-body.md"
          node tools/ci/figmaSyncReport.mjs pr-body "${SYNC_REPORT_PATH}" > "${body_file}"
          title=$(git log --reverse --format=%s "origin/master..origin/${BRANCH}" | head -1)
          existing=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // ""')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${body_file}"
            url=$(gh pr view "${existing}" --json url --jq .url)
          else
            url=$(gh pr create --base master --head "${BRANCH}" --title "${title}" --body-file "${body_file}")
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Link to open the pull request
        id: compare
        if: steps.report.outputs.pushed == 'true' && vars.FIGMA_SYNC_OPEN_PR != 'true'
        env:
          BRANCH: ${{ steps.report.outputs.branch }}
        run: |
          title=$(git log --reverse --format=%s "origin/master..origin/${BRANCH}" | head -1)
          url=$(node tools/ci/figmaSyncReport.mjs compare-url "${SYNC_REPORT_PATH}" \
            --server-url "${GITHUB_SERVER_URL}" --repository "${GITHUB_REPOSITORY}" --title "${title}")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Start CI on the pull request
        if: steps.pull-request.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.report.outputs.branch }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          # GitHub does not run pull_request workflows for a PR opened with the default token, but it
          # does run workflow_dispatch.
          base_sha=$(git merge-base origin/master "origin/${BRANCH}")
          failed=false
          gh workflow run ci.yml --ref "${BRANCH}" -f base-sha="${base_sha}" || failed=true
          gh workflow run visreg-web.yml --ref "${BRANCH}" -f pr-number="${PR_URL##*/}" || failed=true
          if [ "${failed}" = "true" ]; then
            echo "::warning::Could not start CI on ${BRANCH}. Close and reopen the pull request to run it."
            echo "CI could not be started on the pull request. Close and reopen it to run CI." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write the job summary
        if: steps.report.outputs.found == 'true'
        env:
          PR_URL: ${{ steps.pull-request.outputs.url }}
          COMPARE_URL: ${{ steps.compare.outputs.url }}
          PUSHED: ${{ steps.report.outputs.pushed }}
          REJECTED: ${{ steps.report.outputs.rejected }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### Sync ${TARGET}"
            if [ -n "${PR_URL}" ]; then
              echo "Pull request: ${PR_URL}"
            elif [ -n "${COMPARE_URL}" ]; then
              echo "Branch pushed. [Open the pull request](${COMPARE_URL})"
            else
              echo "No changes to publish."
            fi
            if [ "${REJECTED}" != "0" ]; then
              echo
              echo "#### Skipped, needs a fix in Figma"
              node tools/ci/figmaSyncReport.mjs rejections "${SYNC_REPORT_PATH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.rejected[] | "::warning title=Figma asset skipped::\(.name): \(.message | gsub("[\r\n]+"; " "))"' "${SYNC_REPORT_PATH}"

      - name: Fail when the sync crashed
        if: steps.sync.outcome == 'failure' && steps.report.outputs.found != 'true'
        run: |
          echo "The ${{ matrix.target }} sync failed before it wrote a report. See the sync step log."
          exit 1

      - name: Post the run summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.FIGMA_SYNC_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          TARGET: ${{ matrix.target }}
          JOB_STATUS: ${{ job.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SKIPPED: ${{ steps.open-pr.outputs.skip }}
          OPEN_PR_URL: ${{ steps.open-pr.outputs.url }}
          PUSHED: ${{ steps.report.outputs.pushed }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          COMPARE_URL: ${{ steps.compare.outputs.url }}
          FAILED_STEP: ${{ steps.release.outcome == 'failure' && 'Release the package' || steps.pull-request.outcome == 'failure' && 'Open or update the pull request' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then exit 0; fi
          node tools/ci/figmaSyncReport.mjs summary-slack "${SYNC_REPORT_PATH}" \
            --target "${TARGET}" --job-status "${JOB_STATUS}" --sync-outcome "${SYNC_OUTCOME}" \
            --skipped "${SKIPPED}" --open-pull-request-url "${OPEN_PR_URL}" --pushed "${PUSHED}" \
            --pull-request-url "${PR_URL}" --compare-url "${COMPARE_URL}" --failed-step "${FAILED_STEP}" \
            --log-file "${RUNNER_TEMP}/sync.log" --run-url "${RUN_URL}" > "${RUNNER_TEMP}/summary.json"
          curl --fail --silent --show-error --request POST \
            --header 'Content-type: application/json' \
            --data @"${RUNNER_TEMP}/summary.json" \
            "${SLACK_WEBHOOK_URL}" || echo "::warning::Could not post the run summary to Slack."
