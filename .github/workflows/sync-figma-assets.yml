name: Sync Figma Assets

# Syncs icons and illustrations from Figma and pushes a branch for each. An engineer opens the PR,
# does the manual visreg check and merges it; nothing is merged automatically. Squash-merge: the
# workflow's commits are not signed.
#
# The sync scripts only write files, the version plan and a report (SYNC_REPORT_PATH). The workflow
# commits them on a `<target>/YYYY-MM-DD` branch, pushes, and posts one Slack message per target
# (failed, nothing new, or branch pushed with counts and a link to open the PR). Assets that need a
# fix in Figma are skipped and listed in every message.
#
# A sync without renamed or deleted assets is also released on the branch (`yarn release`), so
# merging publishes the package. A breaking sync keeps only the version plan until it has a
# migration guide and a migrator.
#
# Repository configuration (all optional except the Figma token):
#   secrets.FIGMA_ACCESS_TOKEN              Figma token.
#   secrets.FIGMA_SYNC_SLACK_WEBHOOK_URL    Slack webhook, falling back to secrets.SLACK_WEBHOOK_URL.
#                                           With neither set, Slack is skipped.
#   vars.FIGMA_SYNC_SCHEDULE_ENABLED        'true' turns on the weekly schedule (Thursday
#                                           morning, a full comparison). Other runs are manual.
#   vars.FIGMA_SYNC_NOTIFY_GROUPS           Comma-separated Slack user group ids to ping when a branch
#                                           was pushed, the sync failed or assets were skipped (and,
#                                           in the plain fallback message, when the job failed and the
#                                           summary could not be rendered). Unset pings nobody.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to sync
        type: choice
        options:
          - all
          - icons
          - illustrations
        default: all
      full-compare:
        description: Compare every asset, not only new or changed ones
        type: boolean
        default: false
  schedule:
    - cron: '0 14 * * 4'

concurrency:
  group: sync-figma-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync ${{ matrix.target }}
    if: github.event_name != 'schedule' || vars.FIGMA_SYNC_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'icons' && '["icons"]' || inputs.target == 'illustrations' && '["illustrations"]' || '["icons","illustrations"]') }}
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Set the sync report path, date and branch
        env:
          TARGET: ${{ matrix.target }}
        run: |
          date=$(date -u +%F)
          {
            echo "SYNC_REPORT_PATH=${RUNNER_TEMP}/sync-report.json"
            echo "SYNC_DATE=${date}"
            echo "SYNC_BRANCH=${TARGET}/${date}"
          } >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Look for an open sync pull request
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          # The manifest on master only advances when a sync PR merges, so a new scheduled sync would
          # repeat the changes of one that is still waiting for review. Only the sync branch names
          # count, not a person's branch that happens to start with `icons/`.
          open=$(gh pr list --state open --json number,url,headRefName \
            --jq "[.[] | select(.headRefName | test(\"^${TARGET}/[0-9]{4}-[0-9]{2}-[0-9]{2}\$\"))][0].url // \"\"")
          echo "url=${open}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ -n "${open}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A ${TARGET} sync pull request is already open, so this scheduled run skipped it: ${open}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup-node-ci
        if: steps.open-pr.outputs.skip != 'true'

      - name: Configure git identity
        if: steps.open-pr.outputs.skip != 'true'
        run: |
          # setup-node-ci writes enableGlobalCache and enableHardenedMode into .yarnrc.yml, and the
          # sync refuses to start on a dirty tree.
          git checkout -- .yarnrc.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync ${{ matrix.target }} from Figma
        id: sync
        if: steps.open-pr.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          # The weekly schedule compares every asset; a manual run compares new or changed ones unless
          # full-compare is on.
          FULL_COMPARE: ${{ github.event_name == 'schedule' || inputs.full-compare }}
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          args=()
          if [ "${FULL_COMPARE}" = "true" ]; then args+=(--full-compare); fi
          yarn nx run "${TARGET}:sync-${TARGET}" -- "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/sync.log"

      - name: Read the sync report
        id: report
        if: steps.open-pr.outputs.skip != 'true'
        run: |
          if [ ! -f "${SYNC_REPORT_PATH}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "rejected=$(jq '.rejected | length' "${SYNC_REPORT_PATH}")"
            echo "changed=$(jq '[.changes[] | length] | add > 0' "${SYNC_REPORT_PATH}")"
            echo "breaking=$(jq '(.changes.renamed | length) + (.changes.deleted | length) > 0' "${SYNC_REPORT_PATH}")"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push the sync branch
        id: push
        if: steps.report.outputs.found == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "The sync wrote nothing, so there is nothing to push."
            exit 0
          fi
          render="yarn tsx libs/figma-api/src/renderSyncReportCli.ts"
          git checkout -B "${SYNC_BRANCH}"
          git add -A
          git commit -m "$(${render} commit-title "${SYNC_REPORT_PATH}" --date "${SYNC_DATE}")"
          # A rerun on the same day replaces the earlier push; the lease needs the remote branch fetched.
          git fetch origin "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2> /dev/null || true
          git push --force-with-lease origin "${SYNC_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Release the package
        id: release
        if: steps.push.outputs.pushed == 'true' && steps.report.outputs.changed == 'true' && steps.report.outputs.breaking == 'false'
        env:
          BRANCH: ${{ env.SYNC_BRANCH }}
          TARGET: ${{ matrix.target }}
        run: |
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          yarn release --projects="${TARGET}"
          # nx release deletes every pending version plan of the group without releasing it. Put
          # back the plans that also name another package, so that package still gets its release.
          for plan in $(git diff --name-only --diff-filter=D HEAD -- .nx/version-plans); do
            others=$(git show "HEAD:${plan}" |
              awk 'NR == 1 && $0 == "---" { inside = 1; next } inside && $0 == "---" { exit } inside { split($0, kv, ":"); print kv[1] }' |
              grep -vxF "${TARGET}" || true)
            if [ -n "${others}" ]; then git checkout HEAD -- "${plan}"; fi
          done
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to release."
            exit 0
          fi
          git commit -m "chore: release ${TARGET}"
          git push --force-with-lease origin "${BRANCH}"

      - name: Link to open the pull request
        id: compare
        if: steps.push.outputs.pushed == 'true'
        env:
          BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          title=$(git log --reverse --format=%s "origin/master..origin/${BRANCH}" | head -1)
          url=$(yarn tsx libs/figma-api/src/renderSyncReportCli.ts compare-url "${SYNC_REPORT_PATH}" \
            --server-url "${GITHUB_SERVER_URL}" --repository "${GITHUB_REPOSITORY}" \
            --branch "${BRANCH}" --title "${title}")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Write the job summary
        if: steps.report.outputs.found == 'true'
        env:
          COMPARE_URL: ${{ steps.compare.outputs.url }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          REJECTED: ${{ steps.report.outputs.rejected }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### Sync ${TARGET}"
            if [ -n "${COMPARE_URL}" ]; then
              echo "Branch pushed. [Open the pull request](${COMPARE_URL})"
            else
              echo "No changes to publish."
            fi
            status=$(yarn tsx libs/figma-api/src/renderSyncReportCli.ts status "${SYNC_REPORT_PATH}")
            if [ -n "${status}" ]; then
              echo
              echo "#### Status"
              echo "${status}"
            fi
            echo
            yarn tsx libs/figma-api/src/renderSyncReportCli.ts examined "${SYNC_REPORT_PATH}"
            if [ "${REJECTED}" != "0" ]; then
              echo
              echo "#### Skipped, needs a fix in Figma"
              yarn tsx libs/figma-api/src/renderSyncReportCli.ts rejections "${SYNC_REPORT_PATH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.rejected[] | "::warning title=Figma asset skipped::\(.name): \(.message | gsub("[\r\n]+"; " "))"' "${SYNC_REPORT_PATH}"

      - name: Fail when the sync crashed
        if: steps.sync.outcome == 'failure' && steps.report.outputs.found != 'true'
        run: |
          echo "The ${{ matrix.target }} sync failed before it wrote a report. See the sync step log."
          exit 1

      - name: Post the run summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.FIGMA_SYNC_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          TARGET: ${{ matrix.target }}
          JOB_STATUS: ${{ job.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SKIPPED: ${{ steps.open-pr.outputs.skip }}
          OPEN_PR_URL: ${{ steps.open-pr.outputs.url }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          COMPARE_URL: ${{ steps.compare.outputs.url }}
          FAILED_STEP: ${{ (steps.push.outcome == 'failure' && 'Commit and push the sync branch') || (steps.release.outcome == 'failure' && 'Release the package') || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_GROUPS: ${{ vars.FIGMA_SYNC_NOTIFY_GROUPS }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then exit 0; fi
          # One clean list for both the rendered message and the fallback.
          NOTIFY_GROUPS="${NOTIFY_GROUPS//[[:space:]]/}"
          cc=""
          if [ "${JOB_STATUS}" = "failure" ]; then
            for group in ${NOTIFY_GROUPS//,/ }; do
              if [[ "${group}" =~ ^S[A-Z0-9]+$ ]]; then cc="${cc} <!subteam^${group}>"; fi
            done
            if [ -n "${cc}" ]; then cc=" cc:${cc}"; fi
          fi
          rendered=false
          if [ -x node_modules/.bin/tsx ] &&
            yarn tsx libs/figma-api/src/renderSyncReportCli.ts summary-slack "${SYNC_REPORT_PATH}" \
              --target "${TARGET}" --job-status "${JOB_STATUS}" --sync-outcome "${SYNC_OUTCOME}" \
              --skipped "${SKIPPED}" --open-pull-request-url "${OPEN_PR_URL}" --pushed "${PUSHED}" \
              --branch "${SYNC_BRANCH}" --compare-url "${COMPARE_URL}" --failed-step "${FAILED_STEP}" \
              --log-file "${RUNNER_TEMP}/sync.log" --run-url "${RUN_URL}" --notify "${NOTIFY_GROUPS}" > "${RUNNER_TEMP}/summary.json" &&
            jq -e '.text | length > 0' "${RUNNER_TEMP}/summary.json" > /dev/null; then
            rendered=true
          fi
          if [ "${rendered}" = true ]; then
            echo "Rendered the run summary."
          elif [ "${SKIPPED}" = "true" ]; then
            # A skipped run never installs dependencies, so it cannot render the full message.
            jq -n --arg text ":information_source: The ${TARGET} Figma sync did not run: a sync pull request is already open (<${OPEN_PR_URL}|open it>)." '{text: $text}' > "${RUNNER_TEMP}/summary.json"
          elif [ -x node_modules/.bin/tsx ]; then
            jq -n --arg text ":warning: The ${TARGET} Figma sync finished with status ${JOB_STATUS}, but its summary could not be rendered. <${RUN_URL}|Sync run>${cc}" '{text: $text}' > "${RUNNER_TEMP}/summary.json"
          else
            jq -n --arg text ":red_circle: The ${TARGET} Figma sync failed before it could start. Nothing was published. <${RUN_URL}|Sync run>${cc}" '{text: $text}' > "${RUNNER_TEMP}/summary.json"
          fi
          curl --fail --silent --show-error --request POST \
            --header 'Content-type: application/json' \
            --data @"${RUNNER_TEMP}/summary.json" \
            "${SLACK_WEBHOOK_URL}" || echo "::warning::Could not post the run summary to Slack."
