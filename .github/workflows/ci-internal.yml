  lint-styles:
    name: Lint Styles
    runs-on: [medium, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - name: Lint Styles
        run: yarn nx affected --target=lint-styles --base=$NX_BASE --head=$NX_HEAD

  summarize-results:
    needs: [validate, lint, lint-styles, test, typecheck, build, storybook-a11y]
    if: always()
    name: Job Status Rollup
    uses: infra/cb-workflow-result-summary/.github/workflows/workflow-check.yml@master
