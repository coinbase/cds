# TODO: Delete this file for open source
name: CI (github.cbhq.net)
on:
  push:
    branches: master
  pull_request:
    branches: master

concurrency:
  group: CI-${{github.ref_name}}-${{github.event.pull_request.number || github.sha}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

env:
  CI: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: 'https://nx-remote-cache.cbhq.net'
  CB_GHA_BRANCH: ${{github.head_ref || github.base_ref || github.ref_name}}

jobs:
  validate:
    name: Validate
    runs-on: [medium, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - name: Validate Lockfile
        run: yarn tsx ./tools/ci/validators/validateLockfile.ts
      - name: Validate Patches
        run: yarn tsx ./tools/ci/validators/validatePatches.ts
      - name: Validate Versioned
        run: yarn tsx ./tools/ci/validators/validateVersioned.ts
      - name: Validate CDS Versions
        run: yarn tsx ./tools/validateCDSVersions.ts
      - name: Validate Constraints
        run: yarn constraints || exit 1

  lint:
    name: Lint
    runs-on: [large, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - name: Lint
        run: yarn nx affected --target=lint --base=$NX_BASE --head=$NX_HEAD --max-warnings=0

  test:
    name: Test
    runs-on: [xlarge, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - name: Test
        run: yarn nx affected --target=test --base=$NX_BASE --head=$NX_HEAD

  typecheck:
    name: Typecheck
    runs-on: [medium, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - name: Typecheck
        run: yarn nx affected --target=typecheck --base=$NX_BASE --head=$NX_HEAD

  build:
    name: Build
    runs-on: [xlarge, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - name: Build
        run: yarn nx affected --exclude=mobile-app --target=build --base=$NX_BASE --head=$NX_HEAD

  storybook-a11y:
    if: ${{ github.event_name == 'pull_request' }}
    name: Storybook A11y
    runs-on: [medium, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100 # TODO: This needs to include the merge-base
      - uses: ./.github/actions/setup-internal
      - uses: infra/cb-action-docker@master
        with:
          image: 652969937640.dkr.ecr.us-east-1.amazonaws.com/containers/node:v22-chrome-ub22
          command: |-
            yarn nx affected --target=a11y-web
          environment: |-
            STORYBOOK_SKIP_ANIMATION=true
            CI=true

