name: Setup Android
description: JDK 21, Android SDK (compileSdk 36), and Gradle cache for cds-android

runs:
  using: composite
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '21'
        # GitHub Actions cache of ~/.gradle — same backend as the JS Yarn cache,
        # no proprietary Gradle cache provider.
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        # compileSdk for :cds. AGP can download platforms on its own once licenses
        # are accepted; installing 36 here makes a missing-platform failure obvious
        # instead of a mid-build SDK fetch.
        packages: 'tools platform-tools platforms;android-36'
