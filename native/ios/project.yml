name: CDSGallery
options:
  bundleIdPrefix: com.coinbase.cds
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Consume the sibling Swift package (this same directory) for the theme library.
packages:
  CDSDesignSystem:
    path: .

targets:
  # A thin iOS app that reuses the gallery sources and renders the theme on the Simulator.
  # The macOS SPM executable (`swift run CDSGalleryApp`) and this iOS app share the exact same
  # source files under Sources/CDSGalleryApp — the AppKit bits there are `#if os(macOS)`-gated.
  # Named distinctly from the SPM `CDSGalleryApp` product so the scheme isn't ambiguous.
  CDSGalleryiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/CDSGalleryApp
    dependencies:
      - package: CDSDesignSystem
        product: CDSDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coinbase.cds.gallery
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
